name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civicflow
          POSTGRES_USER: civicflow
          POSTGRES_PASSWORD: civicflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicflow" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://civicflow:civicflow@localhost:5432/civicflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Миграции вверх/вниз и сверка с моделями
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Демо-данные
        run: python -m app.db.seed --analyze
      - name: Тесты на PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://civicflow:civicflow@localhost:5432/civicflow_test
        run: |
          PGPASSWORD=civicflow psql -h localhost -U civicflow -d civicflow -c "CREATE DATABASE civicflow_test"
          pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [tests-sqlite]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и смоук-тест docker compose
        run: |
          docker compose up -d --build --wait
          curl -fsS http://localhost:8000/health/ready
          curl -fsS http://localhost:8000/api/v1/analytics/summary
          docker compose down -v
