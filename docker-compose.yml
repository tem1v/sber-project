services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civicflow
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow -d civicflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://civicflow:${POSTGRES_PASSWORD:-civicflow}@db:5432/civicflow
      SEED_DEMO: ${SEED_DEMO:-1}
      SEED_ARGS: ${SEED_ARGS:---analyze}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
